name: Email templates

# Sends the e-mail templates in supabase/templates (and, once set up, the
# Resend mail server) to the staging project on pull requests and to the
# production project after merge to main. Run it by hand after adding the
# Resend secret. Skips cleanly until the Supabase secrets are set.
# See docs/email-setup.md.

on:
  pull_request:
    paths: ["supabase/templates/**", "scripts/email-templates.mjs", "scripts/push-email-templates.mjs"]
  push:
    branches: [main]
    paths: ["supabase/templates/**", "scripts/email-templates.mjs", "scripts/push-email-templates.mjs"]
  workflow_dispatch:
    inputs:
      environment:
        description: Supabase project
        type: choice
        options: [staging, production]
        default: staging

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'pull_request' && 'staging' || 'production') }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Optional, both needed: the Resend API key (secret) and the sender address (variable).
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase secrets not set for this environment; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
      - name: Send templates
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/push-email-templates.mjs
