<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Trainer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Typing Trainer</h1>
      <nav>
        <button data-view="practice" class="active">Practice</button>
        <button data-view="log">Keystroke log</button>
      </nav>
    </header>

    <main>
      <section id="practice-view">
        <div class="layout-bar">
          <label>Keyboard layout <select id="layout-select"></select></label>
          <span id="layout-status"></span>
        </div>
        <div id="layout-suggest" class="layout-suggest" hidden>
          <span id="layout-suggest-text"></span>
          <button id="layout-suggest-yes">Switch</button>
          <button id="layout-suggest-no">Keep mine</button>
        </div>
        <div id="text" class="text" aria-hidden="true"></div>
        <textarea id="input" class="typing-input" aria-label="Type the text shown above" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <p class="hint">Click the text and start typing. Wrong keys are logged and you stay on the same character until you hit the right one.</p>
        <div id="stats" class="stats"></div>
        <button id="new-text">New text</button>
      </section>

      <section id="log-view" hidden>
        <div class="log-actions">
          <span id="log-summary"></span>
          <button id="export-json">Export JSON</button>
          <button id="export-csv">Export CSV</button>
          <button id="clear-log" class="danger">Clear log</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Session</th>
              <th>Lang · layout</th>
              <th>Pos</th>
              <th>Expected</th>
              <th>Actual</th>
              <th>Key</th>
              <th>Prev expected</th>
              <th>Prev actual</th>
              <th>Δ ms</th>
              <th>OK</th>
            </tr>
          </thead>
          <tbody id="log-rows"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
